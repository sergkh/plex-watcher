services:
  plex-watcher:
    image: ghcr.io/sergkh/plex-watcher:sha-1e330a6
    restart: unless-stopped
    user: "1000:1000"
    environment:
      WATCH_DIR: /media/watch
      PLEX_DIR: /media/plex
      PLEX_URL: http://plex:32400
      # https://support.plex.tv/articles/204059436-finding-an-authentication-token-x-plex-token/
      PLEX_TOKEN: your_plex_token_here
      # TMDB API key (free) — get one at https://www.themoviedb.org/settings/api
      TMDB_API_KEY: your_tmdb_api_key_here
      # Comma-separated library section IDs to refresh (empty = refresh all)
      # Find IDs: http://YOUR_PLEX:32400/library/sections?X-Plex-Token=YOUR_TOKEN
      PLEX_LIBRARY_IDS: ""
      # Comma-separated direct subfolders to ignore (default: incomplete)
      IGNORE_DIRS: incomplete
      # Web UI bind address
      WEB_ADDR: 0.0.0.0:8000
      # Optional qBittorrent Web API integration
      QBITTORRENT_URL: http://qbittorrent:8080
      QBITTORRENT_USERNAME: admin
      QBITTORRENT_PASSWORD: adminadmin
      # Optional Prowlarr torrent search integration
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: your_prowlarr_api_key_here
      # Optional comma-separated indexer IDs; empty = all enabled indexers
      PROWLARR_INDEXER_IDS: ""
      # Quiet period (ms) after last file event before notifying Plex
      PLEX_NOTIFY_DEBOUNCE_MS: 10000
      # Log level: error | warn | info | debug | trace
      RUST_LOG: plex_watcher=info
    volumes:
      - ./media:/media/:rw
    ports:
      - "8000:8000"
