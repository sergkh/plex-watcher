<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plex Watcher Search</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f8fc;
      --fg: #172033;
      --muted: #64748b;
      --line: #d8e2ee;
      --panel: #ffffff;
      --panel-soft: #f8fbff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #e8f0ff;
      --accent-fg: #ffffff;
      --danger: #b42318;
      --shadow: 0 8px 24px rgba(37, 99, 235, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #edf4ff;
        --muted: #94a3b8;
        --line: #263244;
        --panel: #141b24;
        --panel-soft: #111827;
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
        --accent-soft: #13243b;
        --accent-fg: #06101f;
        --danger: #ffb4ab;
        --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      }
    }
    * { box-sizing: border-box; }
    [x-cloak] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    main {
      position: relative;
      width: min(1060px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }
    header {
      margin-bottom: 20px;
    }
    .header-main {
      min-width: 0;
    }
    .nav-button {
      width: 32px;
      min-height: 32px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 0;
      display: inline-grid;
      place-items: center;
    }
    .nav-actions {
      position: absolute;
      top: 8px;
      right: 0;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .nav-button:hover,
    .nav-button:focus-visible {
      border-color: color-mix(in srgb, var(--accent), transparent 55%);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .nav-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 750;
      letter-spacing: 0;
    }
    .source {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 22px;
    }
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--fg);
      padding: 0 14px;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent), transparent 78%);
    }
    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:not(.nav-button):not(.icon-button):hover:not(:disabled),
    button:not(.nav-button):not(.icon-button):focus-visible:not(:disabled) {
      background: var(--accent-hover);
    }
    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }
    .status {
      min-height: 24px;
      margin-bottom: 14px;
      color: var(--muted);
    }
    .status.error {
      color: var(--danger);
    }
    .results {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .page[hidden] {
      display: none;
    }
    .downloads {
      margin: 28px 0;
      padding-top: 22px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .toolbar h2 {
      margin: 0;
      font-size: 20px;
    }
    .icon-button {
      width: 32px;
      min-height: 32px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 0;
      display: inline-grid;
      place-items: center;
    }
    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: color-mix(in srgb, var(--accent), transparent 55%);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .icon-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .torrent-list {
      display: grid;
      gap: 8px;
    }
    .torrent {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }
    .torrent strong {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .torrent .path {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .torrent-error {
      grid-column: 1 / -1;
      color: var(--danger);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .torrent button {
      min-height: 34px;
      padding: 0 12px;
      font-size: 14px;
    }
    .torrent-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }
    .checkbox-label input {
      width: 16px;
      min-height: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
    }
    .watch-list {
      display: grid;
      gap: 6px;
    }
    .watch-entry {
      display: grid;
      grid-template-columns: 70px 1fr auto auto auto;
      gap: 8px 12px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 7px 0;
    }
    .watch-entry:hover {
      background: color-mix(in srgb, var(--accent-soft), transparent 55%);
    }
    .watch-entry strong {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .watch-entry span {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .watch-entry button {
      width: 30px;
      min-height: 30px;
    }
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .log-entry {
      display: block;
      padding: 1px 0;
      overflow-wrap: anywhere;
    }
    .log-entry .meta {
      color: var(--muted);
      margin-right: 8px;
    }
    .log-entry .message {
      color: var(--fg);
    }
    .result-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: auto;
    }
    .torrent-toggle {
      width: 32px;
      min-height: 32px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--muted);
      padding: 0;
      display: inline-grid;
      place-items: center;
    }
    .torrent-toggle:hover:not(:disabled),
    .torrent-toggle:focus-visible:not(:disabled) {
      border-color: color-mix(in srgb, var(--accent), transparent 45%);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .torrent-toggle svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 160ms ease;
    }
    .torrent-toggle.open svg {
      transform: rotate(180deg);
    }
    .result-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .result-links a {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      padding: 5px 8px;
    }
    .result-links a:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
    }
    .inline-torrents {
      grid-column: 1 / -1;
      display: none;
    }
    .inline-torrents.open {
      display: block;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .inline-torrents .status {
      margin-bottom: 8px;
    }
    .inline-controls {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .season-controls,
    .manual-query-row {
      display: grid;
      grid-template-columns: auto minmax(120px, 170px);
      gap: 8px;
      align-items: center;
    }
    .manual-query-row {
      grid-template-columns: 1fr auto;
    }
    .season-controls label,
    .manual-query-row label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .season-controls select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--fg);
      padding: 0 10px;
      font: inherit;
    }
    .manual-query-row button {
      min-height: 34px;
      font-size: 14px;
      padding: 0 12px;
    }
    .manual-query-row input {
      min-height: 34px;
    }
    article {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 16px;
      min-height: 230px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .poster {
      width: 150px;
      aspect-ratio: 2 / 3;
      border-radius: 6px;
      background: color-mix(in srgb, var(--line), transparent 30%);
      object-fit: cover;
    }
    .poster.empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }
    .result-body {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    h2 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta-line {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 10px;
    }
    .detail {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 7px 8px;
    }
    .detail-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .detail-value {
      display: block;
      color: var(--fg);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    p {
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
    }
    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    @media (max-width: 560px) {
      main {
        width: min(100vw - 20px, 1060px);
        padding-top: 52px;
      }
      .source {
        white-space: normal;
      }
      form {
        grid-template-columns: 1fr;
      }
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }
      .torrent {
        grid-template-columns: 1fr;
      }
      .watch-entry {
        grid-template-columns: 1fr;
      }
      .season-controls,
      .manual-query-row {
        grid-template-columns: 1fr;
      }
      .watch-entry span {
        white-space: normal;
      }
      article {
        grid-template-columns: 112px 1fr;
        min-height: 178px;
      }
      .poster {
        width: 112px;
      }
      h2 {
        font-size: 18px;
      }
      .detail-grid {
        grid-template-columns: 1fr;
      }
      .log-entry {
        grid-template-columns: 1fr;
      }
      button {
        width: 100%;
      }
      .nav-actions {
        top: 10px;
      }
      .nav-button {
        width: 32px;
      }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <main x-data="mediaApp()" x-cloak>
    <header>
      <div class="header-main">
        <h1 x-text="pageTitle"></h1>
        <div class="source" x-text="pageSource"></div>
      </div>
      <div class="nav-actions">
        <button class="nav-button" type="button" aria-label="Search" title="Search" x-show="page !== 'search'" @click="showSearchPage()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
        </button>
        <button class="nav-button" type="button" aria-label="Downloads" title="Downloads" x-show="page !== 'downloads'" @click="showDownloadsPage()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12"></path>
            <path d="m7 10 5 5 5-5"></path>
            <path d="M5 21h14"></path>
          </svg>
        </button>
        <button class="nav-button" type="button" aria-label="Watched folder" title="Watched folder" x-show="page !== 'watch'" @click="showWatchPage()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>
            <path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button class="nav-button" type="button" aria-label="Logs" title="Logs" x-show="page !== 'logs'" @click="showLogsPage()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h10"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="page" x-show="page === 'search'">
      <form autocomplete="off" @submit.prevent="search">
        <input x-ref="query" x-model="query" name="q" type="search" placeholder="Search for a movie or TV show" autofocus>
        <button type="submit" :disabled="searchLoading">Search</button>
      </form>

      <div class="status" :class="{ error: searchError }" x-text="searchStatus"></div>
      <section class="results" aria-live="polite">
        <template x-for="item in results" :key="`${item.media_type}-${item.tmdb_id}`">
          <article>
            <template x-if="item.poster_url">
              <img class="poster" :src="item.poster_url" :alt="`${item.title} poster`" loading="lazy">
            </template>
            <template x-if="!item.poster_url">
              <div class="poster empty">No poster</div>
            </template>

            <div class="result-body">
              <h2 x-text="resultTitle(item)"></h2>
              <div class="meta-line">
                <div class="meta" x-text="resultMeta(item)"></div>
                <div class="result-links">
                  <a :href="item.tmdb_url" target="_blank" rel="noreferrer">TMDb</a>
                  <template x-if="item.imdb_url">
                    <a :href="item.imdb_url" target="_blank" rel="noreferrer">IMDb</a>
                  </template>
                </div>
              </div>
              
              <p x-text="item.overview || 'No overview available.'"></p>
              <div class="result-footer">
                <button class="torrent-toggle" type="button" :class="{ open: item.torrentOpen }" :disabled="item.torrentLoading" @click="toggleProwlarr(item)" :aria-label="torrentToggleLabel(item)" :title="torrentToggleLabel(item)">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>
              </div>

            </div>

            <div class="inline-torrents" :class="{ open: item.torrentOpen }">
              <div class="inline-controls">
                <template x-if="item.media_type === 'tv'">
                  <div class="season-controls">
                    <label :for="`season-${item.media_type}-${item.tmdb_id}`">Season</label>
                    <select x-model.number="item.selectedSeason" :id="`season-${item.media_type}-${item.tmdb_id}`" :disabled="item.torrentLoading" @change="onSeasonChange(item)">
                      <template x-for="season in seasonOptionCount(item)" :key="season">
                        <option :value="season" x-text="`Season ${season}`"></option>
                      </template>
                    </select>
                  </div>
                </template>
              </div>
              <div class="status" :class="{ error: item.torrentStatusError }" x-text="item.torrentStatus"></div>
              <div class="manual-query-row">
                <input
                  x-model="item.manualTorrentQuery"
                  type="search"
                  :placeholder="`Edit query (default: ${buildDefaultProwlarrQuery(item)})`"
                  @keydown.enter.prevent="searchProwlarrForItem(item, item.manualTorrentQuery)">
                <button type="button" :disabled="item.torrentLoading" @click="searchProwlarrForItem(item, item.manualTorrentQuery)">Search term</button>
              </div>
              <div class="torrent-list">
                <template x-for="result in item.torrentResults" :key="result.magnet_uri || result.title">
                  <div class="torrent">
                    <strong x-text="result.title"></strong>
                    <div class="torrent-actions">
                      <!--label class="checkbox-label">
                        <input type="checkbox" x-model="result.autoupdate" :disabled="result.adding || result.downloaded">
                        <span>autoupdate</span>
                      </label -->
                      <button type="button" :disabled="result.adding || result.downloaded" @click="addTorrentSource(result.magnet_uri, result, item)" x-text="torrentDownloadButtonText(result)"></button>
                    </div>
                    <span class="meta" x-text="`${result.seeders} seeders · ${result.leechers} leechers · ${result.size}`"></span>
                    <template x-if="result.addError">
                      <div class="torrent-error" x-text="result.addError"></div>
                    </template>
                    <div class="path" x-text="result.indexer"></div>
                  </div>
                </template>
              </div>
            </div>
          </article>
        </template>
      </section>
    </section>

    <section class="page downloads" x-show="page === 'downloads'">
      <div class="toolbar">
        <h2>Downloads</h2>
      </div>
      <div class="status" :class="{ error: torrentStatusError }" x-text="torrentStatus"></div>
      <div class="torrent-list" aria-live="polite">
        <template x-for="torrent in torrents" :key="torrent.id">
          <div class="torrent">
            <strong x-text="torrent.name || torrent.id"></strong>
            <span class="meta" x-text="`${torrent.progress_percent.toFixed(1)}% · ${torrent.state}`"></span>
            <div class="path" x-text="torrent.save_path || torrent.id"></div>
          </div>
        </template>
      </div>
    </section>

    <section class="page downloads" x-show="page === 'watch'">
      <div class="toolbar">
        <h2>Watched Folder</h2>
        <button class="icon-button" type="button" :disabled="rescanLoading" @click="rescanWatchDir()" :aria-label="rescanLoading ? 'Scanning watched folder' : 'Rescan watched folder'" :title="rescanLoading ? 'Scanning...' : 'Rescan'">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
        </button>
      </div>
      <div class="status" :class="{ error: watchStatusError }" x-text="watchStatus"></div>
      <div class="watch-list" aria-live="polite">
        <template x-for="entry in watchEntries" :key="entry.path">
          <div class="watch-entry">
            <span x-text="entry.kind"></span>
            <strong x-text="entry.path"></strong>
            <span x-text="formatBytes(entry.size_bytes)"></span>
            <span x-text="formatModified(entry.modified_ms)"></span>
            <button class="icon-button" type="button" :disabled="entry.renaming" @click="renameWatchEntry(entry)" :aria-label="entry.renaming ? `Renaming ${entry.name}` : `Rename ${entry.name}`" :title="entry.renaming ? 'Renaming...' : 'Rename'">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
              </svg>
            </button>
          </div>
        </template>
      </div>
    </section>

    <section class="page downloads" x-show="page === 'logs'">
      <div class="toolbar">
        <h2>Logs</h2>
      </div>
      <div class="status" :class="{ error: logsStatusError }" x-text="logsStatus"></div>
      <div class="log-list" aria-live="polite">
        <template x-for="entry in orderedLogs" :key="`${entry.timestamp_ms}-${entry.level}-${entry.message}`">
          <div class="log-entry">
            <span class="meta" x-text="logMeta(entry)"></span>
            <span class="message" x-text="entry.message"></span>
          </div>
        </template>
      </div>
    </section>
  </main>

  <script>
    function mediaApp() {
      return {
        page: "search",
        query: "",
        searchLoading: false,
        searchError: false,
        searchStatus: "",
        results: [],
        torrents: [],
        torrentStatus: "",
        torrentStatusError: false,
        torrentRefreshTimer: null,
        watchEntries: [],
        watchStatus: "",
        watchStatusError: false,
        rescanLoading: false,
        logs: [],
        logsStatus: "",
        logsStatusError: false,
        logsRefreshTimer: null,

        get pageTitle() {
          if (this.page === "downloads") return "Downloads";
          if (this.page === "watch") return "Watched Folder";
          if (this.page === "logs") return "Logs";
          return "Search";
        },

        get pageSource() {
          if (this.page === "downloads") return "qBittorrent status";
          if (this.page === "watch") return "Current watched directory contents";
          if (this.page === "logs") return "Server watch logs";
          return "TMDb movie and TV search with IMDb links";
        },

        get orderedLogs() {
          return this.logs.slice().reverse();
        },

        async search() {
          const q = this.query.trim();
          this.results = [];
          this.searchError = false;

          if (!q) {
            this.searchStatus = "Enter a movie or TV title.";
            return;
          }

          this.searchLoading = true;
          this.searchStatus = "Searching...";

          try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            if (!response.ok) throw new Error(await response.text());

            const items = await response.json();
            this.results = items.map((item) => ({
              ...item,
              torrentOpen: false,
              torrentLoaded: false,
              torrentLoading: false,
              torrentStatus: "",
              torrentStatusError: false,
              torrentResults: [],
              seasonCount: item.season_count,
              selectedSeason: 1,
              manualTorrentQuery: "",
              lastTorrentQuery: "",
            }));

            this.searchStatus = items.length
              ? `${items.length} result${items.length === 1 ? "" : "s"}`
              : "No movies or TV shows found.";
          } catch (error) {
            this.searchError = true;
            this.searchStatus = error.message || "Search failed.";
          } finally {
            this.searchLoading = false;
          }
        },

        showSearchPage() {
          this.stopTorrentRefresh();
          this.stopLogsRefresh();
          this.page = "search";
          this.$nextTick(() => this.$refs.query?.focus());
        },

        showDownloadsPage() {
          this.stopLogsRefresh();
          this.page = "downloads";
          this.loadTorrents();
          this.startTorrentRefresh();
        },

        showWatchPage() {
          this.stopTorrentRefresh();
          this.stopLogsRefresh();
          this.page = "watch";
          this.loadWatchEntries();
        },

        showLogsPage() {
          this.stopTorrentRefresh();
          this.page = "logs";
          this.loadLogs();
          this.startLogsRefresh();
        },

        resultTitle(item) {
          return item.year ? `${item.title} (${item.year})` : item.title;
        },

        resultMeta(item) {
          return [
            item.media_type === "tv" ? "TV" : "Movie",
            item.year || null,
            item.vote_average ? `TMDb rating ${item.vote_average.toFixed(1)}` : "No TMDb rating",
          ].filter(Boolean).join(" · ");
        },

        resultDetails(item) {
          return [
            { label: "Type", value: item.media_type === "tv" ? "TV Show" : "Movie" },
            { label: "Year", value: item.year || "Unknown" },
            { label: "TMDb Rating", value: item.vote_average ? `${item.vote_average.toFixed(1)} / 10` : "Unrated" },
            { label: "TMDb ID", value: `#${item.tmdb_id}` },
            { label: "IMDb ID", value: item.imdb_id || "Not linked" },
          ];
        },

        torrentToggleLabel(item) {
          if (item.torrentLoading) return "Searching torrents";
          if (item.torrentOpen) return "Close torrents";
          return item.torrentLoaded ? "Open torrents" : "Search torrents";
        },

        torrentDownloadButtonText(result) {
          if (result.adding) return "Adding...";
          if (result.downloaded) return "Downloading";
          return "Download";
        },

        seasonOptionCount(item) {
          const count = Number(item.seasonCount);
          if (Number.isFinite(count) && count > 0) return Math.floor(count);
          return 40;
        },

        async onSeasonChange(item) {
          if (item.media_type !== "tv" || item.torrentLoading) return;
          await this.searchProwlarrForItem(item);
        },

        async toggleProwlarr(item) {
          if (item.torrentOpen) {
            item.torrentOpen = false;
            return;
          }

          if (item.torrentLoaded) {
            item.torrentOpen = true;
            return;
          }

          await this.searchProwlarrForItem(item);
        },

        buildDefaultProwlarrQuery(item) {
          if (item.media_type === "tv") {
            const season = Math.max(1, Number(item.selectedSeason) || 1);
            return `${item.title} S${String(season).padStart(2, "0")}`;
          }

          return item.year && item.media_type === "movie" ? `${item.title} ${item.year}` : item.title;
        },

        async searchProwlarrForItem(item, customQuery = null) {
          const manual = typeof customQuery === "string" ? customQuery.trim() : "";
          const q = manual || this.buildDefaultProwlarrQuery(item);
          item.torrentOpen = true;
          item.torrentLoading = true;
          item.torrentStatusError = false;
          item.torrentStatus = `Searching torrents for ${q}...`;
          item.torrentResults = [];
          item.lastTorrentQuery = q;
          item.manualTorrentQuery = q;

          try {
            const response = await fetch(`/api/prowlarr/search?q=${encodeURIComponent(q)}`);
            if (!response.ok) throw new Error(await response.text());

            const results = await response.json();
            item.torrentResults = results.map((result) => ({
              ...result,
              adding: false,
              downloaded: false,
              addError: "",
              autoupdate: false,
            }));
            item.torrentLoaded = true;
            item.torrentStatus = results.length
              ? `${results.length} torrent result${results.length === 1 ? "" : "s"}`
              : "No torrent results found.";
          } catch (error) {
            item.torrentStatusError = true;
            item.torrentStatus = error.message || "Torrent search failed.";
          } finally {
            item.torrentLoading = false;
          }
        },

        async loadTorrents() {
          this.torrentStatusError = false;
          this.torrentStatus = "Loading downloads...";

          try {
            const response = await fetch("/api/torrents");
            if (!response.ok) throw new Error(await response.text());

            this.torrents = await response.json();
            this.torrentStatus = this.torrents.length
              ? `${this.torrents.length} download${this.torrents.length === 1 ? "" : "s"}`
              : "No active downloads.";
          } catch (error) {
            this.torrents = [];
            this.torrentStatusError = true;
            this.torrentStatus = error.message || "Downloads unavailable.";
          }
        },

        startTorrentRefresh() {
          this.stopTorrentRefresh();
          this.torrentRefreshTimer = window.setInterval(() => {
            if (this.page === "downloads") this.loadTorrents();
          }, 10000);
        },

        stopTorrentRefresh() {
          if (this.torrentRefreshTimer !== null) {
            window.clearInterval(this.torrentRefreshTimer);
            this.torrentRefreshTimer = null;
          }
        },

        async loadWatchEntries() {
          this.watchStatusError = false;
          this.watchStatus = "Loading watched folder...";

          try {
            const response = await fetch("/api/watch");
            if (!response.ok) throw new Error(await response.text());

            this.watchEntries = (await response.json()).map((entry) => ({ ...entry, renaming: false }));
            this.watchStatus = this.watchEntries.length
              ? `${this.watchEntries.length} item${this.watchEntries.length === 1 ? "" : "s"}`
              : "Watched folder is empty.";
          } catch (error) {
            this.watchEntries = [];
            this.watchStatusError = true;
            this.watchStatus = error.message || "Watched folder unavailable.";
          }
        },

        async renameWatchEntry(entry) {
          const newName = window.prompt("Rename watched item", entry.name);
          if (newName === null) return;

          const trimmed = newName.trim();
          if (!trimmed || trimmed === entry.name) return;

          this.watchStatusError = false;
          entry.renaming = true;
          this.watchStatus = `Renaming ${entry.name}...`;

          try {
            const response = await fetch("/api/watch/rename", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ path: entry.path, new_name: trimmed }),
            });
            if (!response.ok) throw new Error(await response.text());

            this.watchEntries = (await response.json()).map((item) => ({ ...item, renaming: false }));
            this.watchStatus = `Renamed ${entry.name} to ${trimmed}.`;
          } catch (error) {
            this.watchStatusError = true;
            this.watchStatus = error.message || "Rename failed.";
          } finally {
            entry.renaming = false;
          }
        },

        async rescanWatchDir() {
          this.watchStatusError = false;
          this.rescanLoading = true;
          this.watchStatus = "Scanning watched folder...";

          try {
            const response = await fetch("/api/watch/rescan", { method: "POST" });
            if (!response.ok) throw new Error(await response.text());

            const result = await response.json();
            const summary = [
              `${result.found_files} found`,
              `${result.processed_files} processed`,
              `${result.changed_files} changed`,
              result.failed_files ? `${result.failed_files} failed` : null,
              result.plex_notified ? "Plex notified" : null,
            ].filter(Boolean).join(" · ");
            await this.loadWatchEntries();
            this.watchStatusError = false;
            this.watchStatus = summary;
          } catch (error) {
            this.watchStatusError = true;
            this.watchStatus = error.message || "Rescan failed.";
          } finally {
            this.rescanLoading = false;
          }
        },

        formatBytes(value) {
          if (value === null || value === undefined) return "";
          if (value < 1024) return `${value} B`;
          const units = ["KB", "MB", "GB", "TB"];
          let size = value / 1024;
          let unit = 0;
          while (size >= 1024 && unit < units.length - 1) {
            size /= 1024;
            unit += 1;
          }
          return `${size.toFixed(size >= 10 ? 1 : 2)} ${units[unit]}`;
        },

        formatModified(value) {
          return value ? new Date(Number(value)).toLocaleString() : "";
        },

        async loadLogs() {
          this.logsStatusError = false;
          this.logsStatus = "Loading logs...";

          try {
            const response = await fetch("/api/logs");
            if (!response.ok) throw new Error(await response.text());

            this.logs = await response.json();
            this.logsStatus = this.logs.length
              ? `${this.logs.length} log entr${this.logs.length === 1 ? "y" : "ies"}`
              : "No logs captured yet.";
          } catch (error) {
            this.logs = [];
            this.logsStatusError = true;
            this.logsStatus = error.message || "Logs unavailable.";
          }
        },

        startLogsRefresh() {
          this.stopLogsRefresh();
          this.logsRefreshTimer = window.setInterval(() => {
            if (this.page === "logs") this.loadLogs();
          }, 10000);
        },

        stopLogsRefresh() {
          if (this.logsRefreshTimer !== null) {
            window.clearInterval(this.logsRefreshTimer);
            this.logsRefreshTimer = null;
          }
        },

        logMeta(entry) {
          return `${new Date(entry.timestamp_ms).toLocaleTimeString()} ${entry.level} ${entry.target}`;
        },

        async addTorrentSource(value, result, item) {
          result.addError = "";

          if (!value) {
            result.addError = "Missing torrent download URL.";
            return;
          }

          result.adding = true;

          try {
            const response = await fetch("/api/torrents/add", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                magnet_uri: value,
                tmdb_title: item?.title,
                tmdb_id: item?.tmdb_id,
                tmdb_year: item?.year,
                autoupdate: Boolean(result?.autoupdate),
              }),
            });
            if (!response.ok) throw new Error(await response.text());

            this.torrents = await response.json();
            result.downloaded = true;
          } catch (error) {
            result.addError = error.message || "Add failed.";
          } finally {
            result.adding = false;
          }
        },
      };
    }
  </script>
</body>
</html>
